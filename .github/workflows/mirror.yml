name: Mirror to GitLab

on:
  push:
    branches:
      - main
      - develop
      - docker

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: ${{ secrets.GITLAB_REPO }}
        run: |
          if [ -z "$GITLAB_USERNAME" ] || [ -z "$GITLAB_TOKEN" ] || [ -z "$GITLAB_REPO" ]; then
            echo "::error::Не задано secrets у GitHub → Settings → Secrets and variables → Actions"
            echo "Потрібні: GITLAB_USERNAME, GITLAB_TOKEN, GITLAB_REPO"
            exit 1
          fi

          REPO_PATH="$GITLAB_REPO"
          REPO_PATH="${REPO_PATH#https://}"
          REPO_PATH="${REPO_PATH#http://}"
          REPO_PATH="${REPO_PATH#/}"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Mirror"

          git remote add gitlab "https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${REPO_PATH}"

          BRANCH="${GITHUB_REF_NAME}"
          echo "Дзеркалимо GitHub/${BRANCH} → GitLab/${BRANCH} (force, GitHub — джерело правди)"

          set +e
          PUSH_OUT=$(git push --force gitlab "HEAD:refs/heads/${BRANCH}" 2>&1)
          PUSH_CODE=$?
          set -e

          echo "$PUSH_OUT"

          if [ "$PUSH_CODE" -ne 0 ]; then
            if echo "$PUSH_OUT" | grep -qiE "protected|pre-receive hook declined|not allowed to push"; then
              echo "::error::GitLab відхилив push — гілка ${BRANCH} захищена."
              echo "GitLab → Settings → Repository → Protected branches → ${BRANCH}:"
              echo "Allowed to push: Maintainers; Allowed to force push: увімкни для цієї гілки."
            elif echo "$PUSH_OUT" | grep -qiE "401|403|authentication|access denied|could not read Username|invalid credentials"; then
              echo "::error::Помилка авторизації GitLab. Перевір GITLAB_USERNAME і GITLAB_TOKEN (scope: write_repository)."
            elif echo "$PUSH_OUT" | grep -qiE "non-fast-forward|rejected"; then
              echo "::error::GitLab все ще відхилив force-push. Перевір Protected branches (force push)."
            else
              echo "::error::git push завершився з кодом ${PUSH_CODE}"
            fi
            exit "$PUSH_CODE"
          fi

          echo "Дзеркало на GitLab оновлено."
